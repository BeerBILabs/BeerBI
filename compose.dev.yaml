services:
  backend-dev:
    build:
      context: ./backend/bot
      dockerfile: ../../docker/backend/Dockerfile
    restart: unless-stopped
    # Longer than the bot's 15 s shutdown budget (shutdownTimeout in main.go): Docker's default
    # of 10 s would SIGKILL it while the event workers still drain queued beer messages.
    stop_grace_period: 20s
    volumes:
      - ./backend/bot:/src
      - ./backend/bot/data:/data
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    environment:
      - ADDR=:8080
      - DB_PATH=/data/bot.db
    networks:
      - beerbot

  frontend-dev:
    build:
      context: ./frontend/project
      dockerfile: ../../docker/frontend/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - BACKEND_BASE=http://backend-dev:8080
      # Same token as the backend, taken from .env (compose reads it for interpolation).
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - ./frontend/project:/app/beerbot
    depends_on:
      - backend-dev
    networks:
      - beerbot

  cache:
    image: redis:8.10
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - beerbot

networks:
  beerbot:
    driver: bridge
