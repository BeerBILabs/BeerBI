# Run via `just test` (or the two `docker compose ... run` commands there).
# Do not use `up --abort-on-container-exit`: the first service to finish would
# stop the other one mid-run and hide its result.
services:
  backend-test:
    build:
      context: ./backend/bot
      dockerfile: ../../docker/backend/Dockerfile
      target: test
    networks:
      - beerbot-test

  # Lint, typecheck, unit tests (TZ pinned in vitest config) and production build.
  frontend-test:
    build:
      context: ./frontend/project
      dockerfile: ../../docker/frontend/Dockerfile
      target: test
    environment:
      NEXT_PUBLIC_BACKEND_BASE: "http://localhost:8080"
    networks:
      - beerbot-test

networks:
  beerbot-test:
    driver: bridge
